services:
  mcp-scraping:
    build: .
    container_name: mcp-scraping
    ports:
      - "8000:8000"
    environment:
      MCP_PORT: "8000"
      SCRAPE_TIMEOUT: "30"
      SCRAPE_MAX_BYTES: "10485760"
      SCRAPE_USER_AGENT: "mcp-scraping-server/1.0 (+local-vm)"
      # Liste blanche optionnelle (sous-domaines autorisés) :
      # SCRAPE_ALLOWED_HOSTS: "intranet.monentreprise.fr,docs.monentreprise.fr"
      # Token optionnel exigé par le client MCP :
      # MCP_TOKEN: "changez-moi"
    restart: unless-stopped
